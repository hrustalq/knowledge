name: ci

# Runs on the homelab's self-hosted runners (`runs-on: homelab`: ephemeral pods
# on the k3s cluster, hrustalq/homelab docs/ci-runners.md), EXCEPT pull requests
# from forks: those are the jobs untrusted code can reach, and a runner pod has a
# privileged Docker daemon on a homelab node, so fork PRs stay on GitHub-hosted
# runners. The runners hold no production access (deploys go through GitOps).
#
# `pull_request` is deliberately unfiltered, so it already gates PRs based on
# `dev` (where features integrate) as well as the promotion PR into `main`. The
# `push` list exists only for the post-merge signal on the two long-lived
# branches; `dev` has to be there or its head is the one commit nobody rechecks.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma's generated client is what supplies apps/api's model types
      # (Prisma.InputJsonValue, the *WhereInput types, every delegate signature).
      # On a clean checkout it does not exist yet, and without it `typecheck`
      # fails with TS2694 plus a flood of implicit-any. The `build` script does
      # generate it — but build runs last, long after typecheck. A working tree
      # that has ever run the app hides this, so only CI catches it.
      - name: Generate Prisma client
        run: pnpm db:generate

      # Mirrors `make check` (lint typecheck deps test build). Kept as discrete
      # steps so a failure names itself in the UI instead of collapsing into one
      # red "make" line. No infra needed: the API build is `prisma generate &&
      # nest build`, which never touches a database.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency rules
        run: pnpm run depcruise

      - name: Test
        run: pnpm test

      # Not covered by the pre-push hook (it deliberately omits build, which
      # would kill a running dev server) — so this is the only gate that runs it.
      - name: Build
        run: pnpm build

  # Browser end-to-end (#80): two Chrome contexts co-edit one page through the
  # real stack. Its own job because `check` runs no services: this one starts
  # the compose infra, the worker, the API (COLLAB_ENABLED=true, AUTH_MODE=none)
  # and the web dev server, then runs Playwright against the runner's Chrome.
  coedit-e2e:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Env files
        run: |
          cp .env.example .env
          cp .env.example apps/api/.env
          echo "COLLAB_ENABLED=true" >> apps/api/.env

      - name: Infra
        run: docker compose up -d postgres minio minio-init redis arcadedb

      - name: Migrate
        run: |
          pnpm db:generate
          for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U knowledge && break; sleep 2; done
          pnpm --filter @knowledge/api exec prisma migrate deploy

      # The web runs as it ships: a production build, not the Vite dev server.
      # Under the dev server a cold editor load compiled ~500 modules on demand
      # (~10 s before its first API call), so any wait shorter than that failed
      # at random — the co-editing and collection specs most often.
      - name: Build the API and the web
        run: pnpm exec turbo run build --filter=@knowledge/api --filter=@knowledge/web

      # From each app's own directory: the API writes its i18n types relative to cwd.
      # The worker goes first: it creates the graph schema, and the SSR pass
      # reads the graph, so the web cannot render before the schema exists.
      #
      # A production server.js installs no /api proxy — Caddy does that in
      # production — so a Caddy in front plays that part here: :5173 (the
      # Playwright baseURL and WEB_BASE_URL) strips /api to the API, WebSockets
      # included, and sends the rest to the SSR app on :5174.
      - name: Start the worker, the API and the web
        run: |
          printf '%s\n' '{' '  auto_https off' '}' ':5173 {' \
            '  handle_path /api/* {' '    reverse_proxy localhost:3000' '  }' \
            '  handle {' '    reverse_proxy localhost:5174' '  }' '}' > "$RUNNER_TEMP/Caddyfile"
          docker run -d --name e2e-proxy --network host \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          (cd apps/api && nohup node dist/worker.main.js > "$RUNNER_TEMP/worker.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf -u root:playwithdata localhost:2480/api/v1/query/knowledge \
              -d '{"language":"sql","command":"select name from schema:types where name = \"Document\""}' \
              | grep -q '"Document"' && break
            sleep 2
          done
          (cd apps/api && nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd apps/web && NODE_ENV=production PORT=5174 nohup node server > "$RUNNER_TEMP/web.log" 2>&1 &)
          for i in $(seq 1 90); do
            curl -sf localhost:5173/api/v1/collab/capabilities | grep -q '"enabled":true' \
              && curl -sf -o /dev/null localhost:5173/ && exit 0
            sleep 2
          done
          echo "stack did not come up"
          docker logs e2e-proxy 2>&1 | tail -20
          tail -50 "$RUNNER_TEMP/worker.log" "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"; exit 1

      - name: Playwright
        run: pnpm --filter @knowledge/web run test:e2e
        env:
          CI: 'true'

      - name: Proxy log on failure
        if: failure()
        run: docker logs e2e-proxy > "$RUNNER_TEMP/proxy.log" 2>&1 || true

      - name: Logs and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coedit-e2e
          path: |
            ${{ runner.temp }}/worker.log
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/proxy.log
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
