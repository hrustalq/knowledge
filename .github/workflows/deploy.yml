name: deploy

# Production runs on the homelab k3s cluster (hrustalq/homelab, k8s/apps/knowledge),
# synced by Argo CD. A release here does three things, all on GitHub-hosted
# runners — no self-hosted runner is exposed by this public repository:
#   1. builds the images for the tag (images.yml → ghcr.io/hrustalq/knowledge-*);
#   2. renders the `production` environment, as the old .env was, and seals it
#      offline with the cluster's public sealed-secrets cert (only the cluster
#      can decrypt it) into two secrets: `knowledge-db-admin` (the Postgres
#      superuser and migration owner) and `knowledge-env` (everything else);
#   3. commits image tag + sealed config + Caddyfile + searxng settings +
#      deploy/postgres-roles.sh to the homelab repo. Argo CD then runs the role
#      script and `prisma migrate deploy` as the owner (a Sync hook, after the
#      datastores and before the app) and rolls the app out.
#
# TAGS DEPLOY, MERGES DO NOT. `dev` is integration; `main` is the released state
# and is still not live until `vX.Y.Z` is pushed. The release runbook is in
# CONTRIBUTING.md#release and the bump rules in docs/versioning.md.
#
# NOTE: the `production` environment must carry a *tag* deployment policy for
# `v*` — a policy listing only `main` will not match refs/tags/v….
#
# Pipeline credentials are named DEPLOY_* and are never rendered into the app's
# config: DEPLOY_HOMELAB_SSH_KEY is a write deploy key on hrustalq/homelab.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)deploy, e.g. v0.46.1"
        type: string
        required: true

# Never run two deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'hrustalq/knowledge'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      # A tag can be cut from any commit, including one that never passed CI on
      # main. Releases come from main or they do not happen.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${{ steps.tag.outputs.tag }} ($sha) is not an ancestor of origin/main — refusing to deploy"
            exit 1
          fi

  images:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ needs.verify.outputs.tag }}

  release:
    needs: [verify, images]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      KUBESEAL_VERSION: 0.41.2
      APP_DIR: homelab/k8s/apps/knowledge
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          path: knowledge

      - uses: actions/checkout@v5
        with:
          repository: hrustalq/homelab
          ssh-key: ${{ secrets.DEPLOY_HOMELAB_SSH_KEY }}
          path: homelab

      # The `production` environment is the source of truth for configuration
      # (#134), exactly as before: its variables and secrets become the app's
      # environment. GitHub refuses names starting GITHUB_, so the API's GITHUB_*
      # keys are stored as GH_* and renamed back here (#138). DEPLOY_* names are
      # pipeline credentials and are dropped. Fails before anything is committed:
      # a key .env.production.example gives a value to must be present, and no
      # value may still be CHANGE_ME.
      - name: Render and seal the production environment
        env:
          ENV_VARS: ${{ toJSON(vars) }}
          ENV_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeseal
          umask 077
          env_json=$(jq -n '
            def named: with_entries(select(.key | test("^[A-Z][A-Z0-9_]*$")) | select(.key | startswith("DEPLOY_") | not)
              | .key |= (if startswith("GH_") then "GITHUB_" + .[3:] else . end));
            ($ENV.ENV_VARS | fromjson | named) as $v
            | ($ENV.ENV_SECRETS | fromjson | named) as $s
            | ([$v | keys[] | select(. as $k | $s | has($k))]) as $both
            | if ($both | length) > 0 then error("set as both a variable and a secret: \($both | join(", "))") else . end
            | ($v + $s) as $all
            | ([$all | to_entries[] | select(.value | contains("CHANGE_ME")) | .key]) as $todo
            | if ($todo | length) > 0 then error("still the CHANGE_ME placeholder: \($todo | join(", "))") else $all end')
          missing=""
          for key in $(grep -E '^[A-Z][A-Z0-9_]*=.' knowledge/.env.production.example | cut -d= -f1); do
            echo "$env_json" | jq -e --arg k "$key" 'has($k)' >/dev/null || missing="$missing $key"
          done
          if [ -n "$missing" ]; then echo "::error::missing from the production environment:$missing"; exit 1; fi
          seal() { # secret name, file, jq filter over the environment
            echo "$env_json" | jq "$3" \
              | jq --arg n "$1" '{apiVersion: "v1", kind: "Secret", type: "Opaque",
                     metadata: {name: $n, namespace: "knowledge"}, stringData: .}' \
              | kubeseal --cert homelab/k8s/platform/sealed-secrets/pub-cert.pem --format yaml \
              > "$APP_DIR/$2"
            # datastores (sync-wave -1) read these secrets, so they must exist first
            yq -i '.metadata.annotations["argocd.argoproj.io/sync-wave"] = "-2"' "$APP_DIR/$2"
            echo "sealed $1: $(echo "$env_json" | jq "$3 | length") keys"
          }
          # Every app pod loads knowledge-env whole, so the superuser's password
          # and the migration owner's login go to a secret only postgres and the
          # migrate Job read (#790).
          admin='["POSTGRES_PASSWORD", "DATABASE_OWNER_URL"]'
          seal knowledge-env      sealedsecret-env.yaml      "with_entries(select(.key as \$k | $admin | index(\$k) | not))"
          seal knowledge-db-admin sealedsecret-db-admin.yaml "with_entries(select(.key as \$k | $admin | index(\$k)))"

      - name: Sync deployment files and image tag
        run: |
          set -euo pipefail
          install -m 644 knowledge/Caddyfile            "$APP_DIR/files/Caddyfile"
          install -m 644 knowledge/searxng/settings.yml "$APP_DIR/files/searxng-settings.yml"
          install -m 644 knowledge/deploy/postgres-roles.sh "$APP_DIR/files/postgres-roles.sh"
          for img in knowledge-api knowledge-api-git knowledge-web; do
            yq -i "(.images[] | select(.name == \"$img\") | .newTag) = \"$TAG\"" "$APP_DIR/kustomization.yaml"
          done
          git -C homelab diff --stat

      - name: Commit to the homelab repo (Argo CD deploys it)
        run: |
          set -euo pipefail
          cd homelab
          git config user.name  "knowledge deploy"
          git config user.email "deploy@knowledge.hrustalq.dev"
          git add k8s/apps/knowledge
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "knowledge: deploy $TAG" -m "From hrustalq/knowledge@${{ github.sha }} (run ${{ github.run_id }})."
          git push origin HEAD:main

      # Argo CD polls every 2 minutes; migrations and the rollout follow. The
      # public endpoint answering is a smoke check, not proof of the new version.
      - name: Verify public endpoint
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null https://knowledge.hrustalq.dev; then
              echo "https://knowledge.hrustalq.dev answers"; exit 0
            fi
            sleep 15
          done
          echo "::error::public endpoint did not answer within 10 minutes"; exit 1
