name: deploy

# SELF-HOSTED. This repository is public, and GitHub warns against exposing a
# self-hosted runner to untrusted code. Every trigger here is therefore a version
# tag or a manual dispatch — NEVER pull_request, which is the one event a fork can
# cause. See also the `if:` repository guard below and the `production`
# environment's deployment-branch policy.
#
# TAGS DEPLOY, MERGES DO NOT. `main` is integration and is not live: pushing
# `vX.Y.Z` is what moves production. The release runbook is in
# CONTRIBUTING.md#release and the bump rules in docs/versioning.md.
#
# NOTE: the `production` environment must carry a *tag* deployment policy for
# `v*`. A policy listing only the `main` branch will not match `refs/tags/v0.1.0`
# and every release will fail closed at the environment gate.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip prisma migrate deploy (use only if migrations already applied)"
        type: boolean
        default: false

# Never run two deploys at once against one box; never cancel one mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A fork that somehow triggers this workflow still cannot run it.
    if: github.repository == 'hrustalq/knowledge'
    runs-on: [self-hosted, linux, x64, knowledge-prod]
    environment: production
    timeout-minutes: 60

    env:
      # Images carry both: VERSION is what a human rolls back to, SHA is what
      # uniquely identifies the build. Neither is `latest`, which moves.
      VERSION: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      DEPLOY_DIR: /srv/knowledge
      COMPOSE: docker compose -f /srv/knowledge/docker-compose.prod.yml

    steps:
      # Full history: the ancestry check below needs more than the tagged commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A tag can be cut from any commit in the repository, including one that
      # never passed CI on main. Releases come from main or they do not happen.
      - name: Verify the tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$VERSION ($SHA) is not an ancestor of origin/main — refusing to deploy"
            exit 1
          fi
          echo "$VERSION is on main"

      # The stack runs out of /srv/knowledge, not out of the runner workspace,
      # which CI rewrites on every job. Only config crosses over; .env is
      # hand-managed on the box and is never touched here.
      - name: Sync deployment config
        run: |
          install -m 644 docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.prod.yml"
          install -m 644 Caddyfile              "$DEPLOY_DIR/Caddyfile"
          test -f "$DEPLOY_DIR/.env" || { echo "::error::$DEPLOY_DIR/.env is missing — create it from .env.production.example"; exit 1; }

      # SEQUENTIALLY, never in parallel: two concurrent tsc processes against a
      # 3.8 GB ceiling is the likeliest way this box OOMs. Each image is tagged
      # with the version, the commit SHA and latest, so a rollback is a retag
      # rather than a rebuild:
      #   docker tag knowledge-api:v0.4.0 knowledge-api:latest && compose up -d
      - name: Build api image
        run: |
          docker build -f Dockerfile.api \
            -t "knowledge-api:$VERSION" -t "knowledge-api:$SHA" -t knowledge-api:latest .

      - name: Build web image
        run: |
          docker build -f Dockerfile.web \
            -t "knowledge-web:$VERSION" -t "knowledge-web:$SHA" -t knowledge-web:latest .

      # Bring datastores up first so migrations have something to talk to.
      - name: Start datastores
        run: $COMPOSE up -d --wait postgres redis minio arcadedb

      # Forward-only, and the database does NOT roll back with a retagged image.
      # That is why every migration must be runnable by the previous release:
      # docs/versioning.md#rollback-and-the-expandcontract-rule.
      - name: Run migrations
        if: ${{ !inputs.skip_migrations }}
        run: $COMPOSE run --rm --no-deps api npx prisma migrate deploy

      - name: Roll out application
        run: $COMPOSE up -d --remove-orphans

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/ && curl -fsS -o /dev/null http://127.0.0.1:5173/; then
              echo "api and web are answering on loopback"; exit 0
            fi
            sleep 5
          done
          echo "::error::services did not become healthy in 150s"
          $COMPOSE ps
          $COMPOSE logs --tail=80 api web
          exit 1

      - name: Verify public endpoint
        run: curl -fsS -o /dev/null -w 'public https://knowledge.hrustalq.dev -> %{http_code}\n' https://knowledge.hrustalq.dev

      - name: Report status
        if: always()
        run: |
          echo "deployed $VERSION ($SHA)"
          $COMPOSE ps

      # Keeps the box from filling up over months of deploys. Tagged images
      # (including the previous version) survive; only dangling layers go.
      - name: Prune dangling images
        if: success()
        run: docker image prune -f
