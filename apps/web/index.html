<!doctype html>
<html lang="<!--app-lang-->">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sora carries no Cyrillic (latin/latin-ext/vietnamese only), so Russian
         headings would fall back to system-ui and lose the display voice.
         Manrope is the geometric companion for those glyphs; browsers fall
         back per glyph, so Latin still renders in Sora. docs/features/18
         Loaded without blocking the first paint (#279): the faces only dress
         headings, and display=swap already draws them in the fallback first.
         A print stylesheet does not block rendering, so it is fetched as one
         and switched to all media once it has loaded.
         The weight axis is requested as a range (600..700), not two static
         cuts: headings use 620 and 650 (editor.css), which only render as
         asked from a variable face — two static files would snap them. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600..700&family=Manrope:wght@600..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@600..700&family=Manrope:wght@600..700&display=swap"
      />
    </noscript>
    <script>
      // Apply the saved theme before paint to avoid a light-mode flash.
      try {
        var t = localStorage.getItem('kn_theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <!--app-css-->
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
