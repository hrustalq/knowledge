# /etc/haproxy.cfg on the home router (NanoPi, OpenWrt 25.12, `ssh router`):
# the public way in to knowledge.hrustalq.dev (#587).
#
# A TCP relay, nothing more: TLS, certificates and routing are the Mac mini's
# Caddy (Caddyfile). Each connection is prefixed with a PROXY v2 header carrying
# the visitor's address, because Colima's ssh port forwarder hides it from
# Caddy, whose `proxy_protocol` listener wrapper reads it back. The two files
# are one contract, which is why this one lives in the repo.
#
# Nothing deploys this file. Apply it by hand, once:
#
#   apk add haproxy-nossl                  # no TLS here
#   scp deploy/router/haproxy.cfg router:/etc/haproxy.cfg
#
#   # LuCI's uhttpd holds :80/:443 on every address; move it so HAProxy can
#   # bind them. LuCI is then https://192.168.2.1:8443.
#   uci delete uhttpd.main.listen_http;  uci add_list uhttpd.main.listen_http='0.0.0.0:8080'
#   uci delete uhttpd.main.listen_https; uci add_list uhttpd.main.listen_https='0.0.0.0:8443'
#   uci commit uhttpd && service uhttpd restart
#
#   uci add firewall rule
#   uci set firewall.@rule[-1].name='Allow-Knowledge-Web'
#   uci set firewall.@rule[-1].src='wan'
#   uci set firewall.@rule[-1].proto='tcp'
#   uci set firewall.@rule[-1].dest_port='80 443'
#   uci set firewall.@rule[-1].target='ACCEPT'
#   uci commit firewall && service firewall reload
#
#   service haproxy check && service haproxy enable && service haproxy restart
#
# Binding every address (not just the WAN one) also gives the LAN, and the
# deploy's public check on the mini, a path to the static address: it lands on
# this same local socket, no NAT reflection involved. v2raya's transparent
# proxy leaves both legs alone: it marks only new outbound SYNs, and the leg
# to the mini is a private address on its whitelist.
#
# The mini is 192.168.20.10 by DHCP reservation (dhcp.@host 'macmini').

defaults
	mode tcp
	timeout connect 5s
	# Idle limits, not request limits: SSE and the events WebSocket sit idle
	# between messages, so these stay long.
	timeout client 1h
	timeout server 1h

frontend web
	bind :80,:443
	default_backend mini

backend mini
	# No port: each connection goes to the port it arrived on, 80 or 443.
	server mini 192.168.20.10 send-proxy-v2
