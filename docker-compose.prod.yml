# Production stack on the Mac mini. Lives at
# ~/Homelab/infra/knowledge/docker-compose.prod.yml
# alongside a .env (chmod 600) that this file both interpolates from and injects
# into containers. deploy.yml renders that .env from the GitHub `production`
# environment on every deploy (#134) — edit the environment, not the file.
#
# Images are built and tagged by .github/workflows/deploy.yml, NOT here — there
# is deliberately no `build:` section, because the deploy dir holds no source
# tree and a stray `compose up` must never try to build one.
#   DOCKER_HOST=unix:///Users/hrustalq/.colima/default/docker.sock \
#     TAG=<sha> docker compose -f docker-compose.prod.yml up -d
# Always name the Colima socket by hand, as deploy.yml does: the box's default
# docker context can be Docker Desktop, which holds none of these images.
#
# EXPOSURE: nothing publishes publicly. The public path is a Cloudflare Worker
# on knowledge.hrustalq.dev -> Tailscale Funnel on the Mac mini -> caddy on
# 127.0.0.1:8088 (a Cloudflare Tunnel cannot connect from this network: its
# handshake is filtered on every egress available). The four datastores get no
# host binding at all — a deliberate break from docker-compose.yml, which
# publishes all of them on 0.0.0.0. api and web bind loopback only, for smoke
# checks on the box.

name: knowledge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Tailscale Funnel's target (`tailscale funnel --bg 8088`), and the
      # loopback smoke check. Loopback only: Funnel connects from the host.
      - "127.0.0.1:8088:80"
    environment:
      # The Caddyfile routes /<bucket>/* to MinIO for presigned URLs (#144),
      # with Host set to the one they are signed for: S3_PUBLIC_ENDPOINT's host.
      S3_BUCKET: ${S3_BUCKET:-knowledge}
      S3_PUBLIC_HOST: ${S3_PUBLIC_HOST:-knowledge.hrustalq.dev}
      # Proves a request came through the Worker, whose visitor headers the
      # Caddyfile then believes (#174). No default: an empty value would make
      # the matcher accept any request that merely carries the header.
      EDGE_SECRET: ${EDGE_SECRET:?set EDGE_SECRET in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - minio

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # pgsty/minio, pinned by tag and digest: upstream no longer publishes
    # anonymously pullable images (docker.io/minio/minio 404, quay.io/minio 401).
    # Full reasoning in docker-compose.yml (#104). Keep both files in step.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket and enables versioning, which the revision
  # store depends on. Exits 0; `up -d` does not wait for it beyond completion.
  minio-init:
    # Same source and pinning rule as minio above (#104).
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_ACCESS_KEY}' '${S3_SECRET_KEY}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-knowledge} &&
      mc version enable local/${S3_BUCKET:-knowledge}
      "
    restart: "no"

  arcadedb:
    # Pinned by tag and digest: the chunk vector index needs 26.10.2's
    # filtered vector.neighbors. Full reasoning in docker-compose.yml (#304).
    image: arcadedata/arcadedb:26.10.2@sha256:7a498ebbbb9a5f02f7d43487c13b6632f83eb7fff345968baf220ac9266fd791
    restart: unless-stopped
    environment:
      # Heap is capped on purpose: the Colima VM (10 GB) also builds images.
      # Unbounded, the JVM sizes itself against total RAM and starves everything else.
      # defaultDatabases grammar is <db>[(<user>:<password>[:<group>])*] — the
      # THIRD element is the group, and omitting it is NOT harmless. `[root:<pw>]`
      # registers root against this database with a null group, which shadows
      # root's server-wide {"*":["admin"]}: reads still succeed, but every DDL
      # returns 403 "User 'root' is not allowed to update schema". The worker then
      # logs "DDL skipped" per statement and every later ingestion job dies on
      # "Type with name 'Chunk' was not found".
      #
      # These comments MUST stay outside the `>-` block below: inside a folded
      # scalar a `#` is literal text, not a comment, and would be handed to the JVM.
      JAVA_OPTS: >-
        -Xms256m -Xmx1g
        -Darcadedb.server.rootPassword=${ARCADE_PASSWORD:?set ARCADE_PASSWORD in .env}
        -Darcadedb.server.defaultDatabases=${ARCADE_DB:-knowledge}[${ARCADE_USER:-root}:${ARCADE_PASSWORD}:admin]
    volumes:
      - arcadedata:/home/arcadedb/databases
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://localhost:2480/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: knowledge-api:${TAG:-latest}
    restart: unless-stopped
    # PID 1 semantics + zombie reaping. main.ts calls enableShutdownHooks(), and
    # without init nothing drains: no sweeper timer cleared, no Redis client
    # disconnected, no in-flight request finished on redeploy.
    init: true
    env_file: [.env]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - applogs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      arcadedb: { condition: service_healthy }

  worker:
    # Same image as api — one build, two commands.
    image: knowledge-api:${TAG:-latest}
    command: ["node", "dist/worker.main"]
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      # Exports (docs/features/45): the worker asks the web container to render
      # an export's HTML over the compose network, never through Caddy — the
      # route answers only callers that came through no proxy.
      WEB_INTERNAL_URL: http://web:5173
    volumes:
      - applogs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      arcadedb: { condition: service_healthy }
    # worker.main.ts is createApplicationContext — no HTTP listener, nothing to
    # curl. This asks Redis which clients are blocked on the five BullMQ queues
    # (ingestion, import, workflow, connector, agent), which proves both that
    # Redis is reachable AND that every processor is actually attached — strictly
    # stronger than PING. It depends on BullMQ's internal connection-naming
    # scheme, so if a BullMQ major bump breaks it, degrade to a plain r.ping():
    # that still catches the most common real failure.
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - |
          const {default:Redis}=await import('ioredis');
          const r=new Redis(process.env.REDIS_URL,{maxRetriesPerRequest:1,connectTimeout:3000,lazyConnect:true});
          await r.connect();
          const list=await r.client('LIST');
          await r.quit();
          const queues=['aW5nZXN0aW9u','aW1wb3J0','d29ya2Zsb3c=','Y29ubmVjdG9y','YWdlbnQ='];
          process.exit(queues.every(n=>list.includes('name=bull:'+n))?0:1);
      interval: 30s
      timeout: 10s
      # worker.main boots six Nest modules before any processor registers.
      start_period: 60s
      retries: 3

  # The learner (#305, docs/features/49 §Derived learnings), opt-in twice like
  # gotenberg: started only when COMPOSE_PROFILES names `learner`, and working
  # only with LEARNER_ENABLED=true in the production environment. Without the
  # flag it idles (it does not exit, so `restart` cannot loop it). Same image as
  # api: learner.main.ts is a fifth entrypoint of apps/api. It reads Postgres,
  # embeds through EMBEDDINGS_* and calls the `coach` through the workspace's
  # provider; it consumes no queue and listens on no port, so there is nothing
  # to health-check beyond the process being up.
  learner:
    image: knowledge-api:${TAG:-latest}
    command: ["node", "dist/learner.main"]
    profiles: ["learner"]
    restart: unless-stopped
    init: true
    env_file: [.env]
    volumes:
      - applogs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }

  # The git remote (#636, docs/features/71), opt-in twice like the learner:
  # started only when COMPOSE_PROFILES names `git`, and serving only with
  # GIT_REMOTE_ENABLED=true; without the flag it answers 404 to every /git/*.
  # Its own image (knowledge-api-git, the `git-runtime` stage: the api image
  # plus the git binary) and its own process (git.main.ts), so packs never pass
  # through the API. Caddy routes /git/* here. The volume holds one bare
  # repository per project and visible set: losing it costs a cold rebuild from
  # Postgres and MinIO, never data.
  git:
    image: knowledge-api-git:${TAG:-latest}
    command: ["node", "dist/git.main"]
    profiles: ["git"]
    restart: unless-stopped
    init: true
    env_file: [.env]
    volumes:
      - gitcache:/var/cache/knowledge-git
      - applogs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  # PDF export (docs/features/45), opt-in: started only when COMPOSE_PROFILES
  # names it. Production sets COMPOSE_PROFILES and GOTENBERG_URL in the GitHub
  # `production` environment, which the deploy renders into .env; a hand edit
  # of the box's .env lasts one release (~2.5 GB image: Chromium +
  # LibreOffice). No ports: only the worker talks to it. Its Chromium is held
  # to its own upload folder — a page can embed any URL, and whatever it
  # fetched would be printed into a PDF the requester downloads.
  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: ["gotenberg"]
    restart: unless-stopped
    command: ["gotenberg", "--chromium-allow-list=^file:///tmp/.*", "--api-timeout=300s"]

  # BM25 keyword search (docs/architecture/04-search-graph.md), opt-in like
  # gotenberg: COMPOSE_PROFILES=…,opensearch plus FULLTEXT_PROVIDER=opensearch
  # and OPENSEARCH_URL=http://opensearch:9200 in the production environment.
  # The provider speaks plain HTTP with no credentials, so the security plugin
  # is off. That is safe only because nothing publishes a port: the only
  # callers are api and worker on the compose network. Single node, and
  # discovery.type=single-node skips the bootstrap checks that would otherwise
  # demand vm.max_map_count from the Colima VM. The heap is pinned and the
  # container capped, because it shares a 10 GB VM with ArcadeDB's JVM. Once
  # it is on, a search fails if it is down (the BM25 leg is awaited), so it
  # restarts like a datastore. Turning it on later needs a reindex
  # (POST /v1/ingestion/reindex) to mirror pages indexed before it.
  opensearch:
    image: opensearchproject/opensearch:2
    profiles: ["opensearch"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1536m
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 8

  web:
    image: knowledge-web:${TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5173
      # Runtime (not build-time) — this one survives verbatim in the SSR bundle.
      API_URL_INTERNAL: http://api:3000
      # Published sites (docs/features/44): hosts under this domain go to the
      # site reader. Interpolated from .env; empty = path mode (/pub/<slug>).
      PUBLISH_BASE_DOMAIN: ${PUBLISH_BASE_DOMAIN:-}
      # The app's own host, which is never looked up as a site's custom domain
      # (issue #77 phase 2b). Any other host is asked of the API once a minute.
      # Serving sites on other hosts also needs the edge to route them here
      # with TLS, which this deployment's does not yet (Caddyfile.sites.example).
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      # Cached site page renders (issue #77 phase 2b-2), revalidated with the
      # API on every request; 0 = off.
      SITE_RENDER_CACHE_MB: ${SITE_RENDER_CACHE_MB:-32}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - applogs:/app/logs
    depends_on:
      - api

  # Web research (docs/features/25). SearXNG metasearches the engines it is
  # pointed at: no API key, no per-query cost, and — the reason it is the first
  # backend — it returns URLs and snippets and fetches nothing, so the platform
  # holds the candidate list and can filter by source policy BEFORE any page is
  # retrieved. Reached as WEB_SEARCH_URL=http://searxng:8080.
  #
  # This service MUST stay in this file, not just on the box: deploy.yml
  # installs this file over the deploy dir copy and then runs
  # `up -d --remove-orphans`, so a service that exists only on the box is
  # deleted by the next release.
  #
  # ./searxng/settings.yml IS the repo's searxng/settings.yml — deploy.yml
  # syncs it like the Caddyfile. Its secret_key is the dev placeholder, which
  # SEARXNG_SECRET below overrides (SearXNG reads server.secret_key from that
  # variable when it is set), so the real secret lives in the environment.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    init: true
    # No host binding, same as the four datastores above: the only callers are
    # api and worker, over the compose network. Its settings.yml runs with
    # `limiter: false` (the API is called by this platform, not by browsers), so
    # a published port would put an unthrottled open metasearch proxy on the
    # box — which gets abused, and then gets the instance blocked by the very
    # upstreams it scrapes.
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in the production environment}
    volumes:
      - ./searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
  miniodata:
  arcadedata:
  osdata:
  caddy_data:
  caddy_config:
  applogs:
  gitcache:
