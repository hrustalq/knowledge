services:
  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # pgsty/minio: Pigsty's community rebuild of upstream MinIO, same binary
    # and CLI, published to Docker Hub for anonymous pulls (#104). Upstream
    # stopped publishing: docker.io/minio/minio is gone (Hub API 404) and
    # quay.io/minio/* answers 401 to anonymous pulls since 2026-09. An existing
    # machine kept working off its cache, which is why both breaks stayed
    # invisible until a fresh pull. Pinned by tag AND digest, never :latest, so
    # a republished tag cannot change what we run. The image also ships `mc`,
    # which the healthcheck below uses. Bump both lines together.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # Same source and pinning rule as minio above (#104).
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/knowledge &&
      mc version enable local/knowledge"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  arcadedb:
    image: arcadedata/arcadedb:latest
    ports: ["2480:2480", "2424:2424"]
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=playwithdata
        -Darcadedb.server.defaultDatabases=knowledge[root]
    volumes:
      - arcadedata:/home/arcadedb/databases
    healthcheck:
      # The image ships no curl — with it the probe failed on a healthy server
      # ("curl: not found"), so the container sat `unhealthy` forever and could
      # not mask a real outage. wget is present; --spider still checks HTTP.
      test: ["CMD-SHELL", "wget -q --spider -T 3 http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Phase 5 optional BM25 layer (plan.md §11). Not started by default:
  # make infra-up-opensearch  (+ FULLTEXT_PROVIDER=opensearch in apps/api/.env)
  opensearch:
    image: opensearchproject/opensearch:2
    profiles: ["opensearch"]
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Knowledge#Dev1"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Feature 25 optional web-search node (docs/features/25). Not started by
  # default:  make infra-up-searxng  (+ WEB_SEARCH_URL + WEB_ACCESS_MODE in
  # apps/api/.env). SearXNG metasearches the engines it is pointed at: no API
  # key, no per-query cost, and — the reason it is the first backend — it
  # returns URLs and snippets and fetches nothing, so the platform holds the
  # candidate list and can filter by source policy BEFORE any page is retrieved.
  #
  # Its JSON API is off by default; searxng/settings.yml turns it on. Without
  # `formats: [json]` every query answers HTML and the provider looks broken.
  searxng:
    image: searxng/searxng:latest
    profiles: ["searxng"]
    # Loopback only. Its settings.yml runs with `limiter: false` (the API is
    # called by this platform, not by browsers), so a 0.0.0.0 bind would put an
    # unthrottled open metasearch proxy on the network — which gets abused, and
    # then gets the instance blocked by the very upstreams it scrapes.
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_BASE_URL: "http://localhost:8888/"
    volumes:
      - ./searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  miniodata:
  arcadedata:
  osdata:
