services:
  postgres:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # pgsty/minio: Pigsty's community rebuild of upstream MinIO, same binary
    # and CLI, published to Docker Hub for anonymous pulls (#104). Upstream
    # stopped publishing: docker.io/minio/minio is gone (Hub API 404) and
    # quay.io/minio/* answers 401 to anonymous pulls since 2026-09. An existing
    # machine kept working off its cache, which is why both breaks stayed
    # invisible until a fresh pull. Pinned by tag AND digest, never :latest, so
    # a republished tag cannot change what we run. The image also ships `mc`,
    # which the healthcheck below uses. Bump both lines together.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # Same source and pinning rule as minio above (#104).
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/knowledge &&
      mc version enable local/knowledge"

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  arcadedb:
    # Pinned by tag and digest (#304): vector search runs on this version's
    # LSM_VECTOR index and `vector.neighbors(…, { filter: (SELECT @rid …) })`.
    # 26.9.x snapshots reject a subquery filter ("must contain RIDs"), and
    # `latest` is a nightly snapshot, so a query feature cannot float with it.
    # A volume written by 26.9.1-SNAPSHOT or 26.11.1-SNAPSHOT opens on it.
    # Keep docker-compose.prod.yml in step.
    image: arcadedata/arcadedb:26.11.1@sha256:22a049898f34f01c256b56a1ba95fb01d32e5e14755d3c4367415c8e55ae5035
    ports: ["127.0.0.1:2480:2480", "127.0.0.1:2424:2424"]
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=playwithdata
        -Darcadedb.server.defaultDatabases=knowledge[root]
    volumes:
      - arcadedata:/home/arcadedb/databases
    healthcheck:
      # The image ships no curl — with it the probe failed on a healthy server
      # ("curl: not found"), so the container sat `unhealthy` forever and could
      # not mask a real outage. wget is present; --spider still checks HTTP.
      test: ["CMD-SHELL", "wget -q --spider -T 3 http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Phase 5 optional BM25 layer (plan.md §11). Not started by default:
  # make infra-up-opensearch  (+ FULLTEXT_PROVIDER=opensearch in apps/api/.env)
  opensearch:
    image: opensearchproject/opensearch:3@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
    profiles: ["opensearch"]
    ports: ["127.0.0.1:9200:9200"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Knowledge#Dev1"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Feature 25 optional web-search node (docs/features/25). Not started by
  # default:  make infra-up-searxng  (+ WEB_SEARCH_URL + WEB_ACCESS_MODE in
  # apps/api/.env). SearXNG metasearches the engines it is pointed at: no API
  # key, no per-query cost, and — the reason it is the first backend — it
  # returns URLs and snippets and fetches nothing, so the platform holds the
  # candidate list and can filter by source policy BEFORE any page is retrieved.
  #
  # Its JSON API is off by default; searxng/settings.yml turns it on. Without
  # `formats: [json]` every query answers HTML and the provider looks broken.
  searxng:
    image: searxng/searxng:latest@sha256:eb8b09ffa83aebbe8b8d3ded23cfd224b2d3b01db4f3af9eb03876ef6def6dda
    profiles: ["searxng"]
    # Loopback only. Its settings.yml runs with `limiter: false` (the API is
    # called by this platform, not by browsers), so a 0.0.0.0 bind would put an
    # unthrottled open metasearch proxy on the network — which gets abused, and
    # then gets the instance blocked by the very upstreams it scrapes.
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_BASE_URL: "http://localhost:8888/"
    volumes:
      - ./searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Feature 41 optional mail catcher (docs/features/41). Not started by default:
  # make infra-up-mailpit  (+ MAIL_TRANSPORT=smtp, MAIL_SMTP_URL=smtp://localhost:1025
  # in apps/api/.env). Accepts anything on :1025 and delivers nowhere — every
  # message lands in the inbox at http://localhost:8025 instead. Loopback only:
  # it relays nothing, but its UI shows every reset link it has ever caught.
  mailpit:
    image: axllent/mailpit:v1.33@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    profiles: ["mailpit"]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # Issue #77 phase 2c optional PDF converter (docs/features/45). Not started by
  # default:  make infra-up-gotenberg  (+ GOTENBERG_URL=http://localhost:3100 in
  # apps/api/.env). Exports send it the HTML and every image as files, so its
  # Chromium never needs the network — and must not have it: a page can embed
  # any URL, and whatever Chromium fetched would be printed into a PDF the
  # requester downloads. The allow-list keeps it to its own upload folder.
  # Loopback only, on 3100 because the API owns 3000.
  gotenberg:
    image: gotenberg/gotenberg:8@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    profiles: ["gotenberg"]
    ports: ["127.0.0.1:3100:3000"]
    command: ["gotenberg", "--chromium-allow-list=^file:///tmp/.*", "--api-timeout=300s"]

  # Issue #75 optional OpenID provider for trying SSO locally (docs/features/54).
  # Not started by default:  make infra-up-keycloak, then run the API with
  # AUTH_MODE=api-key AUTH_SSO_ENABLED=true AUTH_SSO_ALLOW_PRIVATE_URLS=true and
  # add a Keycloak provider with issuer http://localhost:8180/realms/knowledge,
  # client `knowledge`, secret `knowledge-dev-secret`, domain corp.example.
  # keycloak/realm-knowledge.json seeds test users ada/ada (verified) and
  # eve/eve (unverified address). Admin console: admin/admin. Loopback only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    profiles: ["keycloak"]
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    ports: ["127.0.0.1:8180:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Issue #305 learner, for trying it in a container. Not started by default:
  # docker compose --profile learner up -d learner  (+ LEARNER_ENABLED=true in
  # the root .env). Day to day `make dev-learner` runs the same entrypoint from
  # source instead. Built from Dockerfile.api like production; the datastores
  # are reached by their compose names, and an Ollama on the host (the bge-m3
  # the threshold is calibrated for) through host.docker.internal.
  learner:
    profiles: ["learner"]
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    command: ["node", "dist/learner.main"]
    init: true
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://knowledge:knowledge@postgres:5432/knowledge
      REDIS_URL: redis://redis:6379
      EMBEDDINGS_BASE_URL: ${LEARNER_EMBEDDINGS_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  arcadedata:
  osdata:
